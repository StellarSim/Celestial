        value: {section: forward}
      seal_aft:
        system: damage
        action: seal_breach
        value: {section: aft}
      seal_port:
        system: damage
        action: seal_breach
        value: {section: port}
      seal_starboard:
        system: damage
        action: seal_breach
        value: {section: starboard}

  engineer_systems:
