# Physical panel mappings.
#
# Canonical panel IDs mapped onto the shared action
# catalog in backend/internal/input/actions.go. The `actions` keys are the
# panel-local input names (what the physical button is called). Each maps to a
# (system, action) pair that exists in the catalog, with `value` carrying any
# static target data.

panels:
  engineer_power_main:
    id: engineer_power_main
    role: engineer
    actions:
      breaker_reactor:
        system: power
        action: toggle_breaker
        value: {breaker: reactor}
      breaker_engines:
        system: power
        action: toggle_breaker
        value: {breaker: engines}
      breaker_shields:
        system: power
        action: toggle_breaker
        value: {breaker: shields}
      breaker_weapons:
        system: power
        action: toggle_breaker
        value: {breaker: weapons}
      breaker_sensors:
        system: power
        action: toggle_breaker
        value: {breaker: sensors}
      breaker_comms:
        system: power
        action: toggle_breaker
        value: {breaker: comms}
      breaker_life_support:
        system: power
        action: toggle_breaker
        value: {breaker: life_support}
      breaker_navigation:
        system: power
        action: toggle_breaker
        value: {breaker: navigation}

  engineer_damage_main:
